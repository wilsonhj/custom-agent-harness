[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "crates/exec",
    "crates/adapters",
    "crates/engine",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
await_holding_lock = "deny"
