[package]
name = "harness-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
harness-core = { path = "../core" }
harness-store = { path = "../store" }
harness-exec = { path = "../exec" }
harness-adapters = { path = "../adapters" }
tokio = { version = "1.54.1", features = ["process", "io-util", "rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-util = "0.7"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"

[features]
# Test-only crash points: `ENG_FAILPOINT=<name>` makes the process SIGKILL itself there. Also
# builds `eng-test-shim` for the engine's own integration tests.
failpoints = []

[dev-dependencies]
harness-engine = { path = ".", features = ["failpoints"] }

[[bin]]
name = "eng-test-shim"
path = "src/bin/eng-test-shim.rs"
required-features = ["failpoints"]
test = false
doctest = false
