[package]
name = "harness-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
harness-core = { path = "../core" }
harness-engine = { path = "../engine" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = "0.7.20"

[[bin]]
name = "eng"
path = "src/main.rs"
